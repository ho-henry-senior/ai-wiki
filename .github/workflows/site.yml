name: Website

# Builds the wiki as a website on every pull request, and publishes it to
# GitHub Pages from main. See maintainers/MAINTAINING.md#website.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Only the website's own packages, without running install scripts.
      - name: Install tools
        run: npm ci --prefix site --ignore-scripts
      - name: Test link rewriting and search ranking
        run: node --test scripts/site-links.test.mjs scripts/search-ranking.test.mjs scripts/site-contents.test.mjs
      - name: Build the site
        run: npm run build --prefix site
      - name: Check the built site
        run: |
          for file in index.html pages/index.html pages/security/index.html 404.html search-index.json sitemap/index.html; do
            test -f "_site/$file" || { echo "Missing _site/$file" >&2; exit 1; }
          done
          if ! grep -q 'index="https://ho-henry-senior.github.io/ai-wiki/search-index.json"' _site/index.html; then
            echo "The search box does not point to the published search index." >&2
            grep -o '<app-search[^>]*>' _site/index.html >&2
            exit 1
          fi
          if find _site -type d -name README | grep -q .; then
            echo "A README.md was not turned into its folder's index page." >&2
            exit 1
          fi
          headings=$(grep -o "<h1" _site/pages/security/index.html | wc -l)
          if [ "$headings" -ne 1 ]; then
            echo "The security page has $headings h1 headings; expected 1." >&2
            exit 1
          fi
          if grep -rlE "govuk-crest|govuk-icon|rebrand/images|govuk-footer__crown|govuk-logo" _site --include=*.html; then
            echo "Pages use the crown or GOV.UK icons, which only GOV.UK may use." >&2
            exit 1
          fi
          if grep -rliE "Crown copyright|open-government-licence" _site --include=*.html; then
            echo "Pages show a copyright or licence statement; the footer should have none." >&2
            exit 1
          fi
          if grep -rl 'href="/ai-wiki/ai-wiki/' _site --include=*.html || grep -q '/ai-wiki/ai-wiki/' _site/search-index.json; then
            echo "Links have the path prefix twice." >&2
            exit 1
          fi
          if [ -d _site/assets/fonts ]; then
            echo "The GDS Transport font files were published." >&2
            exit 1
          fi
      - name: Check the navigation
        run: |
          for lane in guidance reference articles; do
            test -f "_site/$lane/index.html" || { echo "Missing the $lane lane page" >&2; exit 1; }
          done
          articles=$(grep -c 'app-document-list__item"' _site/articles/index.html || true)
          if [ "$articles" -ne 5 ]; then
            echo "The Articles page lists $articles articles; expected 5." >&2
            exit 1
          fi
          grep -q 'href="/ai-wiki/pages/local-agent-security/"' _site/pages/cloud-agent-security/index.html || {
            echo "The cloud agent page has no sidebar link to its sibling guide." >&2
            grep -c "sub-navigation" _site/pages/cloud-agent-security/index.html >&2 || true
            grep -oE '<nav[^>]*>|href="[^"]*"' _site/pages/cloud-agent-security/index.html | head -25 >&2
            grep -oE '<nav[^>]*>|href="[^"]*"' _site/guidance/index.html | head -25 >&2
            exit 1
          }
          # Concepts sit under the goal they serve, not in a group of their own.
          if grep -q 'href="/ai-wiki/concepts/"' _site/guidance/index.html; then
            echo "The Guidance sidebar still has a Concepts group." >&2
            exit 1
          fi
          grep -q 'sub-navigation' _site/concepts/tests-are-evidence/index.html || {
            echo "A concept page has no Guidance sidebar." >&2
            exit 1
          }
          grep -q 'href="/ai-wiki/guidance/"' _site/index.html || {
            echo "The top bar does not link to the Guidance lane." >&2
            exit 1
          }
      - name: Check pages show when their facts were checked
        run: |
          grep -q "Facts checked 15 November 2026" _site/pages/cloud-agent-security/index.html || {
            echo "The cloud agent page does not show its checked date." >&2
            grep -o "app-checked[^<]*" _site/pages/cloud-agent-security/index.html >&2 || true
            exit 1
          }
      - name: Check pages show their status and a contents list
        run: |
          page=_site/pages/cloud-agent-security/index.html
          grep -q 'govuk-tag--green app-status">Established<' "$page" || {
            echo "The cloud agent page does not show its Established status." >&2
            grep -o 'app-page-details.\{0,300\}' "$page" >&2 || true
            exit 1
          }
          grep -q 'govuk-tag--yellow app-status">Developing<' _site/pages/choose-a-model-and-control-cost/index.html || {
            echo "The cost guide does not show its Developing status." >&2
            exit 1
          }
          if grep -q 'app-status' _site/pages/glossary/index.html; then
            echo "The glossary has no status, but shows one." >&2
            exit 1
          fi
          grep -q 'class="app-contents-list"' "$page" && grep -q 'href="#what-github-enforces"' "$page" || {
            echo "The cloud agent page has no contents list linking to its sections." >&2
            exit 1
          }
      - name: Check the glossary's letters are one line of links
        run: |
          grep -q 'app-contents-list app-contents-list--letters' _site/pages/glossary/index.html || {
            echo "The glossary's letter list is not marked to show on one line." >&2
            exit 1
          }
          if grep -q 'app-contents-list--letters' _site/pages/cloud-agent-security/index.html; then
            echo "The cloud agent page's contents list is shown as letters." >&2
            exit 1
          fi
          grep -q 'app-contents-list--letters' _site/assets/application.css || {
            echo "The stylesheet has no style for letter lists." >&2
            exit 1
          }
      - name: Check pages link to their tags
        run: |
          page=_site/pages/cloud-agent-security/index.html
          grep -q 'href="/ai-wiki/tags/copilot-cloud-agent/">Copilot cloud agent</a>' "$page" || {
            echo "The cloud agent page does not link to its tag." >&2
            grep -o 'app-tags.\{0,300\}' "$page" >&2 || true
            exit 1
          }
          grep -q 'Secure the Copilot cloud agent' _site/tags/copilot-cloud-agent/index.html || {
            echo "The Copilot cloud agent tag page does not list the cloud agent page." >&2
            exit 1
          }
          grep -q 'Copilot CLI' _site/tags/index.html || {
            echo "The tags index does not list Copilot CLI." >&2
            exit 1
          }
          if [ -e _site/surfaces ]; then
            echo "Surface pages are still published; they were replaced by tags in #76." >&2
            exit 1
          fi
      - name: Check the footer links
        run: |
          for href in /ai-wiki/pages/glossary/ /ai-wiki/tags/ /ai-wiki/sitemap/ https://github.com/ho-henry-senior/ai-wiki/blob/main/maintainers/README.md https://github.com/ho-henry-senior/ai-wiki; do
            grep -q "govuk-footer__link\" href=\"$href\"" _site/index.html || {
              echo "The footer has no link to $href." >&2
              grep -o 'govuk-footer__meta.\{0,1200\}' _site/index.html >&2 || true
              exit 1
            }
          done
      - name: Check diagrams are set up to render
        run: |
          page=_site/pages/agent-role-boundaries/index.html
          grep -q '<pre class="mermaid">' "$page" || { echo "The Mermaid diagram was not marked for drawing." >&2; exit 1; }
          grep -q 'assets/mermaid.min.js' "$page" || { echo "The diagram page does not load Mermaid." >&2; exit 1; }
          test -s _site/assets/mermaid.min.js || { echo "mermaid.min.js was not published." >&2; exit 1; }
          if grep -q 'mermaid.min.js' _site/pages/security/index.html; then
            echo "A page without a diagram loads Mermaid." >&2
            exit 1
          fi
      - name: Show a sample of the output
        run: |
          grep -oE "<(h1|h2)[^>]*>[^<]*|href=\"/ai-wiki/[^\"]*\"" _site/pages/security/index.html | head -60
          echo "--- articles"
          tr -d '\n' < _site/articles/index.html | grep -oE 'item-title">[[:space:]]*<a[^>]*>[^<]*' || true
          head -c 800 _site/search-index.json
      - name: Check the search ranking script is included
        run: |
          test -f _site/assets/search.js && test -f _site/assets/search-ranking.js
          grep -q 'src="../../assets/search.js"' _site/pages/security/index.html
          grep -q 'src="assets/search.js"' _site/index.html
      - name: Check search results have a dark text colour
        run: |
          if ! grep -qE '\.app-search__menu\{--govuk-text-colour: ?#0b0c0c' _site/assets/application.css; then
            echo "Search results would inherit the header's white text colour." >&2
            grep -oE '\.app-search__menu\{[^}]*\}' _site/assets/application.css >&2 || true
            exit 1
          fi
      - name: Check the GDS Transport typeface is not used
        run: |
          if grep -rl "GDS Transport" _site --include=*.css; then
            echo "The compiled CSS uses GDS Transport, which only GOV.UK may use." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
