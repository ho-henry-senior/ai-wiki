name: Website

# Builds the wiki as a website on every pull request, and publishes it to
# GitHub Pages from main. See MAINTAINING.md#website.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install tools
        run: |
          npm ci
          npm run site:setup
      - name: Test link rewriting
        run: npm run test:site
      - name: Build the site
        run: npm run site
      - name: Check the GDS Transport typeface is not used
        run: |
          if grep -rl "GDS Transport" _site --include=*.css; then
            echo "The compiled CSS uses GDS Transport, which only GOV.UK may use." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
