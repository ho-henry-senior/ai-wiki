name: Format diagnostics (temporary)
on:
  push:
    branches: [case-study-multipage-210]
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Show exact Prettier changes
        run: |
          npx prettier --write content/articles/lo-fi-factory-{issues,dispatch,reviews,lessons}.md
          git diff -- content/articles/lo-fi-factory-issues.md content/articles/lo-fi-factory-dispatch.md content/articles/lo-fi-factory-reviews.md content/articles/lo-fi-factory-lessons.md
